[mysqld]
# DEXCEL 本地开发实例（plan.md 6.1：MySQL 8.4 单库）
port=3306
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
datadir=C:/Users/Lenovo/CodeBuddy/DEXCEL/mysql/data
# 本地开发：限制只监听本机
